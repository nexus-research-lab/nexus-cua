name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Format and schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Install workspace packaging Cargo
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Verify formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Verify locked dependency graph
        run: cargo +1.88.0 metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Verify committed schemas
        run: make schema-check CARGO='cargo +1.88.0'
      - name: Verify generated Skill and MCP catalogue
        run: make skill-check
      - name: Verify Markdown links
        run: make docs
      - name: Verify pinned workflow actions
        run: make workflow-check
      - name: Verify packaged crate graph
        run: make package-verify CARGO='cargo +1.90.0'

  native:
    name: Native ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Windows x64 is not supported yet; NEXUS_CUA_WINDOWS_ENABLED=true restores it.
        include: ${{ fromJSON(vars.NEXUS_CUA_WINDOWS_ENABLED == 'true' && '[{"name":"macOS","os":"macos-14"},{"name":"Windows","os":"windows-2022"}]' || '[{"name":"macOS","os":"macos-14"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Windows'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.88-${{ hashFiles('Cargo.lock') }}
      - name: Lint native implementation
        if: runner.os != 'Windows'
        run: cargo +1.88.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        if: runner.os != 'Windows'
        run: cargo +1.88.0 test --workspace --locked
      - name: Test official Go client
        if: runner.os != 'Windows'
        working-directory: sdk/go
        run: go test ./...
      - name: Run complete Windows source quality gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows.ps1 -RustToolchain 1.88.0

  remote-transport:
    name: Two-process remote transport evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Run bounded mutual-TLS gateway conformance
        run: make remote-validate CARGO='cargo +1.88.0' REMOTE_SOURCE_REVISION="$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nexus-cua-remote-transport-${{ github.sha }}
          path: target/remote-evidence/summary.json
          if-no-files-found: error
          retention-days: 14

  python-client:
    name: Python client ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2022
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test official Python client
        shell: bash
        run: |
          PYTHONPATH=sdk/python/src python -m compileall -q sdk/python/src sdk/python/tests sdk/python/examples
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir target/python-package sdk/python

  typescript-client:
    name: TypeScript client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install pinned development compiler
        working-directory: sdk/typescript
        run: npm ci --ignore-scripts
      - name: Type-check and test official TypeScript client
        working-directory: sdk/typescript
        run: npm run check
