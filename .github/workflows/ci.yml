name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Format and schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Install workspace packaging Cargo
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Verify formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Verify locked dependency graph
        run: cargo +1.88.0 metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Verify committed schemas
        run: make schema-check CARGO='cargo +1.88.0'
      - name: Verify Markdown links
        run: make docs
      - name: Verify packaged crate graph
        run: make package-verify CARGO='cargo +1.90.0'

  native:
    name: Native ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.88-${{ hashFiles('Cargo.lock') }}
      - name: Lint native implementation
        run: cargo +1.88.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo +1.88.0 test --workspace --locked
      - name: Test official Go client
        working-directory: sdk/go
        run: go test ./...

  python-client:
    name: Python client ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2022
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test official Python client
        shell: bash
        run: |
          PYTHONPATH=sdk/python/src python -m compileall -q sdk/python/src sdk/python/tests sdk/python/examples
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir target/python-package sdk/python
