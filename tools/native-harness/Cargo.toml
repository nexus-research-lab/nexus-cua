[package]
name = "nexus-cua-native-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
nexus-cua-protocol = { path = "../../crates/protocol" }
nexus-cua-transport = { path = "../../crates/transport" }
png = "0.18.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.177"
